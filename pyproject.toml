[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailvalidator"
version = "0.3.3"
description = "Mail server configuration assessment CLI utility"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0"
license-files = ["LICENSE"]
authors = [{ name = "t0kubetsu" }]
keywords = [
    "email",
    "email-security",
    "mail",
    "smtp",
    "dns",
    "dnsbl",
    "spf",
    "dmarc",
    "dkim",
    "bimi",
    "mta-sts",
    "tlsrpt",
    "dane",
    "tls",
    "cybersecurity",
    "security-audit",
    "domain-analysis",
    "networking",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Internet :: Name Service (DNS) :: DNS Utilities",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "dnspython>=2.8.0",
    "rich>=15.0.0",
    "typer>=0.26.7",
    "aiohttp>=3.14.3",
    "cryptography>=49.0.0",
    "pyopenssl>=26.4.0",
    "chainvalidator @ file:./vendor/chainvalidator",
    "quantumvalidator @ file:./vendor/quantumvalidator",
]

[project.urls]
Homepage = "https://github.com/NC3-TestingPlatform/mailvalidator"
Repository = "https://github.com/NC3-TestingPlatform/mailvalidator"
Issues = "https://github.com/NC3-TestingPlatform/mailvalidator/issues"
Changelog = "https://github.com/NC3-TestingPlatform/mailvalidator/blob/main/CHANGELOG.md"

[project.scripts]
mailvalidator = "mailvalidator.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mailvalidator*"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.6", "pytest-mock>=3.15.1"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff's default rule set as of 0.6, made explicit. Without this the linted
# rule set is whatever the installed ruff defaults to, which widens on every
# release — so a green local run and a red CI run can disagree purely by
# version. Pinning it here makes the bar reviewable and stable.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=mailvalidator --cov-report=term-missing"
